<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- format-ok CCが機械で読む自己点検の出力（しげ向け成果物ではない） -->
<title>わけを はなそう 自己点検</title>
<style>
  :root{color-scheme: light dark; --ground:#ffffff; --ink:#1b1b1b;}
  @media (prefers-color-scheme: dark){ :root{--ground:#14191f; --ink:#e8edf2;} }
  html{font-size:24px;}
  body{background:var(--ground); color:var(--ink); font-family:monospace; font-size:0.6rem; white-space:pre;}
</style>
<script>
  /* 無音化（自己点検でも音の入口は使わせない。tools/mkpage.py と同じ塞ぎ方） */
  window.__audioAsked = 0;
  (function () {
    function blocked() { window.__audioAsked++; throw new Error('自己点検では音を出せません'); }
    window.AudioContext = blocked; window.webkitAudioContext = blocked; window.OfflineAudioContext = blocked; window.Audio = blocked;
    try { window.HTMLMediaElement.prototype.play = blocked; } catch (e) {}
    try { Object.defineProperty(window, 'speechSynthesis', { value: { speak: blocked, cancel: function () {} }, configurable: true }); } catch (e) {}
  })();
  window.__loadErrors = [];
  window.onerror = function (msg, src, line, col) { window.__loadErrors.push('ERR ' + msg + ' @' + src + ':' + line + ':' + col); };
</script>
</head>
<body>
<div id="out">（まだ）</div>
<script src="../src/core.js" onerror="window.__loadErrors.push('ERR core load failed')"></script>
<script src="../src/bench.js" onerror="window.__loadErrors.push('ERR bench load failed')"></script>
<script src="../src/gen.js" onerror="window.__loadErrors.push('ERR gen load failed')"></script>
<script>
/* 1) 計算の 部分（src/core.js＋src/gen.js）  2) 画面の 部品＝無音の複製（logs/silent_index.html）の中で WH.ui.selfTest
   2) が 終わるまでは FAIL を 出しておく（複製が 読めない・時間切れ＝不合格） */
(function () {
  var out = document.getElementById('out'), lines = [], pass = 0, fail = 0, head;
  function keysOf(arr) {
    var seen = {}, keys = [], i, m;
    for (i = 0; i < arr.length; i++) { m = /^(?:FAIL )?(K\d+) /.exec(arr[i]); if (m && !seen[m[1]] && arr[i].indexOf('FAIL') !== 0) { seen[m[1]] = true; keys.push(m[1]); } }
    keys.sort(function (a, b) { return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10); });
    return keys;
  }
  function write(extra) {
    var keys = keysOf(lines), need = ['K4', 'K21', 'K22', 'K23', 'K24', 'K26', 'K29', 'K30'], miss = [], i, f = fail;
    for (i = 0; i < need.length; i++) { if (keys.indexOf(need[i]) < 0) { miss.push(need[i]); } }
    if (miss.length) { f++; }
    out.textContent = ['PASS=' + pass + ' FAIL=' + f].concat(lines, miss.length ? ['FAIL Kの こうもくが たりない ' + miss.join(',')] : [], extra || [], ['KEYS=' + keys.join(',')], window.__loadErrors).join('\n');
  }
  try {
    if (!window.WH || !window.WH.selfTest) { throw new Error('WH が無い＝core.js・gen.js が最後まで実行されていない'); }
    lines = window.WH.selfTest(document);
    head = /^PASS=(\d+) FAIL=(\d+)$/.exec(lines.shift());
    pass = parseInt(head[1], 10); fail = parseInt(head[2], 10);
  } catch (e) {
    out.textContent = 'FAIL=exception ' + (e && e.message ? e.message : e) + '\n' + window.__loadErrors.join('\n') + '\n' + (e && e.stack ? e.stack : '');
    document.title = 'DONE';
    return;
  }
  fail++;
  write(['FAIL がめんの ぶひん（無音の複製）が まだ おわっていない']);
  fail--;
  var f = document.createElement('iframe');
  f.style.width = '1024px'; f.style.height = '640px'; f.style.border = '0';
  f.onload = function () {
    var w = f.contentWindow, r;
    try {
      if (!w.WH || !w.WH.ui || !w.WH.ui.selfTest) { throw new Error('複製に WH.ui.selfTest が無い'); }
      if (!(w.__audioAsked >= 0) || typeof w.HTMLMediaElement.prototype.play !== 'function' || String(w.HTMLMediaElement.prototype.play).indexOf('__audioAsked') < 0) { throw new Error('複製の 無音化が 効いていない'); }
      r = w.WH.ui.selfTest();
      pass += r.pass; fail += r.fail; lines = lines.concat(r.lines);
      if (w.WH.snd.ctx !== null || (w.WH.snd.keep && !w.WH.snd.keep.paused)) { fail++; lines.push('FAIL 複製で 音の しくみが 作られた'); }
      write([]);
    } catch (e2) {
      fail++; write(['FAIL がめんの ぶひん 例外 ' + (e2 && e2.message ? e2.message : e2) + ' ' + (e2 && e2.stack ? e2.stack : '')]);
    }
    document.title = 'DONE';
  };
  f.src = '../logs/silent_index.html';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
